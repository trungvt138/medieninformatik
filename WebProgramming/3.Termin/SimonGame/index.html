<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Simon</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <h1 id="level-title">Press A Key to Start</h1>
  <div class="container">
    <div class="row">

      <div type="button" id="green" class="btn green">
        <img type="icon" id="frog" class="icn frog" src="./assets/icons/frog.svg" alt="Frog">
      </div>

      <div type="button" id="red" class="btn red">
        <img type="icon" id="buffalo" class="icn buffalo" src="./assets/icons/buffalo.svg" alt="Buffalo">
      </div>
    </div>

    <div class="row">

      <div type="button" id="yellow" class="btn yellow">
        <img type="icon" id="cat" class="icn cat" src="./assets/icons/cat.svg" alt="Cat">
      </div>

      <div type="button" id="blue" class="btn blue">
        <img type="icon" id="dog" class="icn dog" src="./assets/icons/dog.svg" alt="Dog">
      </div>

    </div>

  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="index.js" charset="utf-8"></script>
</body>

</html>
